<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospitalita CRM — Manager Report</title>
<style>
:root { --primary:#0F2C4C; --accent:#1A6BB5; --bg:#F5F7FB; --card:#fff; --text:#1E2A3A; --muted:#6B7C93; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); }
.header { background:linear-gradient(135deg,var(--primary),#1A4A7A); color:#fff; padding:24px 20px; }
.header h1 { font-size:22px; font-weight:600; }
.header p { opacity:.85; font-size:13px; margin-top:4px; }
.container { max-width:1100px; margin:0 auto; padding:16px; }
.toolbar { background:#fff; border-radius:12px; padding:12px 14px; margin-bottom:16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; box-shadow:0 2px 8px rgba(15,44,76,.06); }
.toolbar select, .toolbar input { padding:8px 10px; border:1.5px solid #E2E8F0; border-radius:8px; font-size:13px; }
.btn { background:var(--accent); color:#fff; border:none; padding:9px 14px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; }
.section { background:#fff; border-radius:12px; padding:16px; margin-bottom:16px; box-shadow:0 2px 8px rgba(15,44,76,.06); }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; padding:10px 8px; background:#F8FAFC; color:var(--primary); font-weight:600; border-bottom:2px solid #E8EEF4; }
td { padding:9px 8px; border-bottom:1px solid #F1F5F9; }
.badge { display:inline-block; padding:3px 8px; border-radius:12px; font-size:11px; font-weight:600; background:#EBF5FB; color:var(--accent); }
.empty { text-align:center; padding:40px 16px; color:var(--muted); }
@media (max-width:700px) { table { font-size:12px; } th,td { padding:8px 6px; } }
</style>
</head>
<body>
<div class="header">
  <h1>Hospitalita CRM — Manager Report</h1>
  <p>All staff submissions • Live from cloud</p>
</div>
<div class="container">
  <div class="toolbar">
    <select id="brandFilter"><option value="">All Brands</option><option>Hotel Per Hour</option><option>Social Media</option><option>Creatif Events</option></select>
    <select id="staffFilter"><option value="">All Staff</option></select>
    <input type="date" id="dateFilter">
    <button class="btn" onclick="loadData()">Refresh</button>
  </div>
  <div class="section">
    <div id="status" style="font-size:13px; color:var(--muted); margin-bottom:10px;">Loading…</div>
    <div style="overflow-x:auto;">
      <table id="reportTable">
        <thead>
          <tr><th></th><th>Time</th><th>Staff</th><th>Brand</th><th>Date</th><th>KPIs</th><th>Notes</th></tr>
        </thead>
        <tbody id="reportBody"></tbody>
      </table>
      <div id="detailPanel" style="display:none; margin-top:16px; padding:14px; background:#F8FAFC; border-radius:10px; font-size:13px;"></div>
    </div>
    <div id="empty" class="empty" style="display:none;">No submissions yet. Ask staff to open their dashboard and click Save.</div>
  </div>
</div>
<script>
const WEBAPP = 'https://script.google.com/macros/s/AKfycbynsHj7IrmVGfuG_nYvg6zpumzx0cr3-0931JElVErAR7AhCRzB7iVa917754UrFF4uFA/exec';
let allRows = [];

async function loadData() {
  document.getElementById('status').textContent = 'Loading…';
  try {
    const res = await fetch(WEBAPP);
    const data = await res.json();
    allRows = data.rows || [];
    render();
  } catch (e) {
    document.getElementById('status').textContent = 'Could not load data. Check the Apps Script deployment.';
  }
}

function render() {
  const brand = document.getElementById('brandFilter').value;
  const staff = document.getElementById('staffFilter').value;
  const date = document.getElementById('dateFilter').value;
  let rows = allRows.filter(r => {
    if (brand && r.brand !== brand) return false;
    if (staff && r.staff !== staff) return false;
    if (date && r.date !== date) return false;
    return true;
  });
  const staffs = [...new Set(allRows.map(r => r.staff).filter(Boolean))];
  const sel = document.getElementById('staffFilter');
  const current = sel.value;
  sel.innerHTML = '<option value="">All Staff</option>' + staffs.map(s => `<option ${s===current?'selected':''}>${s}</option>`).join('');
  const tbody = document.getElementById('reportBody');
  tbody.innerHTML = '';
  if (rows.length === 0) {
    document.getElementById('empty').style.display = 'block';
    document.getElementById('status').textContent = '0 rows';
    return;
  }
  document.getElementById('empty').style.display = 'none';
  rows.forEach((r, idx) => {
    const tr = document.createElement('tr');
    const kpiText = r.kpis ? Object.entries(r.kpis).filter(([k,v]) => v).map(([k,v]) => `${k}: ${v}`).join(' • ') : '';
    tr.innerHTML = `
      <td><button class="btn" style="padding:4px 10px; font-size:12px;" onclick="showDetail(${idx})">View</button></td>
      <td>${(r.timestamp||'').slice(0,19).replace('T',' ')}</td>
      <td><span class="badge">${r.staff || ''}</span></td>
      <td>${r.brand || ''}</td>
      <td>${(r.date||'').slice(0,10)}</td>
      <td style="max-width:280px; font-size:12px;">${kpiText || '—'}</td>
      <td style="max-width:160px; font-size:12px;">${(r.notes || '').slice(0,60)}</td>
    `;
    tbody.appendChild(tr);
  });
  window.currentRows = rows;
  document.getElementById('status').textContent = rows.length + ' submission(s)';
}

document.getElementById('brandFilter').onchange = render;
document.getElementById('staffFilter').onchange = render;
document.getElementById('dateFilter').onchange = render;
function showDetail(i) {
  const r = window.currentRows[i];
  const panel = document.getElementById('detailPanel');
  let html = '<strong>' + (r.staff||'') + ' — ' + (r.brand||'') + '</strong> &nbsp;|&nbsp; Date: ' + (r.date||'').slice(0,10) + '<br>';
  if (r.kpis && r.kpis.score) html += '<strong>Weighted Score: ' + r.kpis.score + ' / 100</strong><br><br>';
  else html += '<br>';
  if (r.kpis) {
    html += '<strong>Headline & Activity KPIs:</strong><br>';
    Object.entries(r.kpis).forEach(([k,v]) => {
      if (k === 'zones' || k === 'hotels' || k === 'score') return;
      if (v) html += '• ' + k + ': <strong>' + v + '</strong><br>';
    });
    if (r.kpis.zones) {
      html += '<br><strong>Geographic Zones:</strong><br>';
      Object.entries(r.kpis.zones).forEach(([z, vals]) => {
        html += '• ' + z + ' — Signed: ' + (vals.signed||0) + ', Live: ' + (vals.live||0) + '<br>';
      });
    }
    if (r.kpis.hotels && r.kpis.hotels.length) {
      html += '<br><strong>Hotels Visited / Prospected:</strong><br>';
      r.kpis.hotels.forEach(h => {
        if (h.name) html += '• <strong>' + h.name + '</strong> (' + (h.zone||'') + ') — ' + (h.status||'') + ' — Contact: ' + (h.contact||'') + ' — Rooms: ' + (h.rooms||'') + '<br>';
      });
    }
  }
  if (r.notes) html += '<br><strong>Weekly Notes:</strong><br>' + (r.notes||'').replace(/\n/g,'<br>');
  panel.innerHTML = html;
  panel.style.display = 'block';
  panel.scrollIntoView({behavior:'smooth'});
}
loadData();
</script>
</body>
</html>
